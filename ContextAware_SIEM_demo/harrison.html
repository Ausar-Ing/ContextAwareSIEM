<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: russellmitchell, seed 0</title>
<style>
:root {
  --page: #d9dee6; --bg: #f1f3f7; --surface: #ffffff; --surface2: #f5f7fa; --line: #e4e9f0; --grid: #edf1f6;
  --ink: #0f172a; --ink2: #334155; --muted: #64748b; --faint: #a6b1c2;
  --accent: #2457c5; --accent-soft: #e8effd; --rba: #c4621c; --rba-soft: #fcefe3; --wazuh: #475569;
  --bar: #a3b0c3; --train: #eef3fb; --amber: #92600a; --amber-soft: #fdf3d3; --amber-line: #f1d48a;
  --head: #0f172a; --head-ink: #ffffff; --head-muted: #9fb0c8; --head-badge: rgba(251, 191, 36, .13); --head-badge-ink: #fde9a8; --head-badge-line: rgba(251, 191, 36, .45);
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px rgba(15, 23, 42, .06);
  --pop: 0 2px 6px rgba(15, 23, 42, .10), 0 24px 60px rgba(15, 23, 42, .26);
  --st-service_scan: #1baf7a; --st-wpscan: #eda100; --st-dirb: #008300; --st-attacker_change_user: #e34948; --st-escalated_sudo_command: #6250d6;
  --st-dnsteal: #c2378f;
}
:root[data-theme="dark"] {
  --page: #05070b; --bg: #0a0e16; --surface: #121927; --surface2: #182135; --line: #243049; --grid: #1c2538;
  --ink: #e8ecf4; --ink2: #bcc6d8; --muted: #8c98ad; --faint: #56637b;
  --accent: #78a2ff; --accent-soft: #1b2b4f; --rba: #f09a52; --rba-soft: #3a2413; --wazuh: #a9b4c8;
  --bar: #55668a; --train: #151e30; --amber: #fbd36b; --amber-soft: #3a2e0d; --amber-line: #6b5415;
  --head: #060910; --head-muted: #8c98ad;
  --shadow: 0 0 0 1px #222c42; --pop: 0 0 0 1px #33415f, 0 24px 60px rgba(0, 0, 0, .6);
  --st-service_scan: #199e70; --st-wpscan: #c98500; --st-dirb: #0ca30c; --st-attacker_change_user: #e66767; --st-escalated_sudo_command: #9085e9;
  --st-dnsteal: #e477b9;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; }
body { font-family: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; color: var(--ink); }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; background: var(--bg); transform-origin: 0 0; overflow: hidden; font-size: 18px; line-height: 1.3; }
button, select { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
button:focus-visible, .row:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.num { font-variant-numeric: tabular-nums; }
sub, sup { font-size: .72em; line-height: 0; }
.card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.cap { font-size: 14px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

/* header */
#banner { height: 56px; background: var(--head); color: var(--head-ink); display: flex; align-items: center; padding: 0 24px; gap: 14px; }
#banner svg { flex: none; }
#banner h1 { font-size: 21px; margin: 0; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
#banner .sub { font-size: 18px; color: var(--head-muted); white-space: nowrap; }
#banner .badge { margin-left: auto; display: flex; align-items: center; gap: 10px; background: var(--head-badge); color: var(--head-badge-ink);
  border: 1px solid var(--head-badge-line); border-radius: 999px; padding: 5px 18px 6px 14px; font-size: 18px; font-weight: 600; white-space: nowrap; }
#banner .badge i { width: 9px; height: 9px; border-radius: 50%; background: #fbbf24; }
#banner .scn { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, .07); }
#banner .scn b, #banner .scn a { font-size: 17px; padding: 3px 12px 4px; border-radius: 7px; white-space: nowrap; }
#banner .scn b { background: rgba(255, 255, 255, .17); color: var(--head-ink); font-weight: 650; }
#banner .scn a { color: var(--head-muted); text-decoration: none; font-weight: 600; }
#banner .scn a:hover { color: var(--head-ink); }
.legend.many table { margin-top: 0; } .legend.many td { height: 18.4px; font-size: 15.5px; } .legend.many .dot { width: 11px; height: 11px; }

/* timeline */
#timeline { margin: 10px 24px 0; height: 174px; display: flex; padding: 10px 20px 0; }
#timeline .chart { width: 1452px; }
.thead { display: flex; align-items: baseline; gap: 12px; height: 24px; }
.thead .sm { font-size: 17px; color: var(--muted); }
.legend { flex: 1; border-left: 1px solid var(--line); padding-left: 20px; margin-bottom: 10px; }
.legend table { border-collapse: collapse; width: 100%; margin-top: 3px; }
.legend td { padding: 0; height: 22px; font-size: 17px; white-space: nowrap; }
.legend td.t, .legend td.n { text-align: right; color: var(--ink2); padding-left: 10px; }
.legend td.n span { color: var(--muted); }
.legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
.legend .code { display: inline-block; width: 46px; font-size: 15px; font-weight: 650; color: var(--muted); }
svg text { font-family: inherit; }
.ax { fill: var(--muted); font-size: 15px; }
.lab { fill: var(--ink2); font-size: 17px; }
.labb { fill: var(--ink); font-weight: 650; }

/* tags */
.tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 1px 7px; border-radius: 11px; font-size: 14.5px; font-weight: 650;
  color: var(--ink); background: color-mix(in srgb, var(--c) 17%, var(--surface)); white-space: nowrap; vertical-align: 1px; }
.tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.tag.plain { background: var(--surface2); color: var(--muted); font-weight: 600; padding: 0 9px 1px; }
.tag.solid { background: var(--accent); color: #fff; padding: 0 9px 1px; } :root[data-theme="dark"] .tag.solid { color: #0a0e16; }
.tag.warm { background: var(--amber-soft); color: var(--amber); padding: 0 9px 1px; }

/* nav */
#nav { height: 50px; margin: 8px 24px; display: flex; align-items: center; gap: 14px; }
.seg { display: flex; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; gap: 2px; }
.seg button { height: 42px; padding: 0 24px; border-radius: 9px; font-size: 20px; font-weight: 650; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--surface); }
.seg.small button { height: 34px; padding: 0 16px; font-size: 17px; font-weight: 600; }
.seg.small button.on { background: var(--accent-soft); color: var(--accent); }
#nav .scene { margin-left: auto; display: flex; align-items: baseline; gap: 12px; }
#nav .scene b { font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
.prog { display: flex; gap: 6px; align-items: center; margin-left: 6px; }
.prog i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); opacity: .55; }
.prog i.on { background: var(--accent); opacity: 1; width: 22px; border-radius: 4px; }
#nav .keys { font-size: 15px; color: var(--muted); margin-left: 8px; white-space: nowrap; }
kbd { font: inherit; font-size: 14px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; background: var(--surface); color: var(--ink2); }

/* content */
#content { position: relative; height: 764px; margin: 0 24px; }
.view { display: none; height: 100%; }
.view.on { display: block; }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.wide { display: grid; grid-template-columns: 1340px 1fr; gap: 16px; align-items: start; }
.col { overflow: hidden; border-top: 5px solid var(--wazuh); }
.col.B2 { border-top-color: var(--accent); } .col.B_RBA { border-top-color: var(--rba); }
.qhead { padding: 8px 16px 9px; display: grid; grid-template-columns: 1fr auto; row-gap: 6px; align-items: baseline; }
.qname { font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: var(--wazuh); white-space: nowrap; }
.col.B2 .qname { color: var(--accent); } .col.B_RBA .qname { color: var(--rba); }
.qname small { font-size: 17px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.qmetric { font-size: 17px; color: var(--muted); white-space: nowrap; }
.qmetric b { font-size: 22px; color: var(--ink); font-weight: 700; margin-left: 6px; font-variant-numeric: tabular-nums; }
.qmetric em { font-style: normal; margin-left: 8px; }
.qchips { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.qchip { background: var(--surface2); border-radius: 8px; padding: 2px 10px 3px; font-size: 17px; color: var(--ink2); }
.qchip b { color: var(--ink); font-weight: 700; margin-left: 4px; }
.qchips .tie { margin-left: auto; font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.qchips .tie i { width: 3px; height: 16px; border-radius: 2px; background: var(--faint); }
.row, .rowhead { display: grid; align-items: center; column-gap: 12px; padding: 0 16px 0 10px; white-space: nowrap; }
/* scene 4: rank, the score the queue is sorted by, rule, host, alerts, time */
.cols .col.B0 .row, .cols .col.B0 .rowhead { grid-template-columns: 44px 44px 1fr 110px 56px 86px; }
.cols .col.B2 .row, .cols .col.B2 .rowhead { grid-template-columns: 44px 68px 1fr 110px 50px 86px; }
.cols .col.B_RBA .row, .cols .col.B_RBA .rowhead { grid-template-columns: 44px 54px 1fr 110px 50px 86px; }
.wide .row, .wide .rowhead { grid-template-columns: 52px 176px 160px 1fr 54px 76px 122px; }
.rowhead { height: 24px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface2); }
.rowhead span { font-size: 13px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.row { height: 31px; border-bottom: 1px solid var(--grid); cursor: pointer; font-size: 18px; }
.wide .row { height: 27px; } .wide .cut { height: 24px; line-height: 23px; }
.row:hover { box-shadow: inset 0 0 0 2px var(--faint); }
.row.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.row.benign { color: var(--muted); }
.row.attack { background: color-mix(in srgb, var(--st) 8%, var(--surface)); color: var(--ink); font-weight: 550; }
.row .rk { align-self: stretch; display: flex; align-items: center; justify-content: flex-end; position: relative; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); padding-right: 9px; }
.row.benign .rk { color: var(--ink2); font-weight: 650; }
.rk.tie::after { content: ""; position: absolute; right: 0; top: -1px; bottom: 0; width: 3px; background: var(--faint); }
.rk.tie.first::after { top: 6px; border-radius: 2px 2px 0 0; } .rk.tie.last::after { bottom: 6px; border-radius: 0 0 2px 2px; }
.rowhead .rk { text-align: right; padding-right: 9px; }
.row .ds { overflow: hidden; text-overflow: ellipsis; }
.row .ds .tag { margin-right: 6px; }
.row .host { overflow: hidden; text-overflow: ellipsis; }
.cols .row .host, .cols .row .r { font-size: 16.5px; font-weight: 400; color: var(--muted); }
.cols .row.attack .host, .cols .row.attack .r { color: var(--ink2); }
.cols .row .r.sc { font-size: 17px; font-weight: 700; color: var(--ink); }
.row .r, .rowhead .r { text-align: right; font-variant-numeric: tabular-nums; }
.cut { height: 26px; line-height: 25px; padding: 0 16px; font-size: 15.5px; color: var(--muted); background: var(--surface2); border-bottom: 1px solid var(--line);
  border-top: 2px solid var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cut b { color: var(--ink2); font-weight: 650; }
.side { padding: 16px 20px 18px; }
.side h3 { margin: 0 0 4px; font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
.side p { margin: 0; font-size: 17px; color: var(--muted); }
.strip { display: grid; grid-template-columns: 158px 1fr 50px; align-items: center; row-gap: 14px; column-gap: 8px; margin: 18px 0 10px; }
.strip .v { text-align: right; font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.note { font-size: 16px; color: var(--muted); }

/* detail sheet */
#detail { position: absolute; top: 0; width: 613px; max-height: 764px; overflow: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--pop); padding: 16px 22px 16px; z-index: 5; }
#detail.left { left: 0; } #detail.right { right: 0; }
#detail[hidden] { display: none; }
#detail h3 { margin: 0 44px 3px 0; font-size: 23px; font-weight: 650; letter-spacing: -.01em; }
#detail .meta { font-size: 17px; color: var(--muted); margin-bottom: 8px; }
#detail .cap { margin: 11px 0 7px; padding-top: 10px; border-top: 1px solid var(--line); }
#detail .x { position: absolute; right: 14px; top: 12px; width: 36px; height: 36px; border-radius: 10px; background: var(--surface2); font-size: 22px; line-height: 1; color: var(--muted); }
.fbtn { display: block; width: 100%; margin-top: 10px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 650; } :root[data-theme="dark"] .fbtn { color: #0a0e16; }
.ranks3 { display: flex; gap: 10px; }
.ranks3 div { flex: 1; background: var(--surface2); border-radius: 10px; padding: 6px 12px 7px; font-size: 15.5px; color: var(--muted); border-left: 4px solid var(--wazuh); }
.ranks3 div.B2 { border-left-color: var(--accent); } .ranks3 div.B_RBA { border-left-color: var(--rba); }
.ranks3 b { display: block; font-size: 28px; line-height: 1.1; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.ranks3 b small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.ranks3 i { display: block; font-style: normal; font-size: 15px; color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.terms { display: grid; grid-template-columns: 222px 1fr 50px 140px; column-gap: 10px; row-gap: 7px; align-items: center; font-size: 18px; }
.track { height: 8px; background: var(--grid); border-radius: 4px; position: relative; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
.track.off i { background: var(--faint); }
.terms .w { color: var(--ink2); font-variant-numeric: tabular-nums; }
.terms .off { color: var(--muted); }
.total { margin-top: 10px; font-size: 21px; font-weight: 700; }
.total span { font-weight: 400; font-size: 17px; color: var(--muted); margin-left: 6px; }
.feat { display: grid; grid-template-columns: 1fr 124px 196px; column-gap: 10px; row-gap: 4px; font-size: 18px; }
.feat .h { font-size: 13px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.feat .r { text-align: right; font-variant-numeric: tabular-nums; }

/* walkthrough */
.whead { display: flex; align-items: baseline; gap: 14px; height: 34px; white-space: nowrap; }
.whead h3 { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -.01em; flex: none; }
.whead .a { font-size: 18px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.whead .real { margin-left: auto; font-size: 16px; color: var(--muted); flex: none; }
.whead select { flex: none; align-self: center; height: 32px; max-width: 330px; padding: 0 10px; border-radius: 9px; background: var(--surface); box-shadow: var(--shadow); font-size: 16px; color: var(--ink2); }
.whead .reset { flex: none; align-self: center; margin-left: auto; height: 32px; padding: 0 14px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: 16px; font-weight: 650; }
.stepper { display: grid; grid-template-columns: repeat(5, 1fr) 236px; gap: 10px; height: 66px; margin: 8px 0 12px; }
.step { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); text-align: left; color: var(--muted); }
.step .n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--grid); display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.step .t { font-size: 18px; font-weight: 650; display: block; }
.step .v { font-size: 18px; display: block; visibility: hidden; font-variant-numeric: tabular-nums; }
.step.done { color: var(--ink2); } .step.done .v { visibility: visible; } .step.done .n { background: var(--accent-soft); color: var(--accent); }
.step.on { box-shadow: var(--shadow), inset 0 0 0 2px var(--accent); color: var(--ink); }
.step.on .n { background: var(--accent); color: #fff; } :root[data-theme="dark"] .step.on .n { color: #0a0e16; }
.step.on .v { font-weight: 650; }
.navb { display: flex; gap: 10px; }
.navb button { flex: 1; border-radius: 14px; font-size: 20px; font-weight: 650; background: var(--surface); box-shadow: var(--shadow); color: var(--ink2); }
.navb button.next { background: var(--accent); color: #fff; } :root[data-theme="dark"] .navb button.next { color: #0a0e16; }
.navb button:disabled { opacity: .35; cursor: default; }
.panel { display: none; grid-template-columns: 1200px 1fr; gap: 16px; height: 644px; }
.panel.on { display: grid; }
.pcard { padding: 16px 22px; overflow: hidden; }
.pcard h4 { margin: 0 0 10px; font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
.pcard h4 span { font-weight: 400; color: var(--muted); }
.say { font-size: 20px; color: var(--ink2); margin: 0 0 14px; line-height: 1.4; }
.say.q { font-size: 24px; font-weight: 650; color: var(--ink); letter-spacing: -.01em; line-height: 1.3; }
.stat { background: var(--surface2); border-radius: 12px; padding: 10px 16px 12px; margin-top: 10px; }
.stat b { display: block; font-size: 36px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 18px; color: var(--ink2); }
.stat span em { font-style: normal; color: var(--muted); }
.tbl { display: grid; font-size: 18px; align-items: center; }
.tbl > div { height: 35px; line-height: 35px; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--grid); }
.tbl.tight > div { height: 27px; line-height: 27px; }
.tbl .h, .tbl.tight .h { height: 28px; line-height: 28px; font-size: 13px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .cur { background: var(--accent-soft); font-weight: 650; }
.tbl .big { font-weight: 700; }
.tbl .top { background: var(--amber-soft); font-weight: 650; }
.deriv { font-size: 19px; color: var(--ink2); margin-top: 4px; font-variant-numeric: tabular-nums; } .stat .deriv b { display: inline; font-size: inherit; letter-spacing: 0; color: var(--ink); font-weight: 700; }
.tbl .x15 { color: var(--muted); border-top: 2px solid var(--faint); }
.ibar { position: relative; height: 8px; }
.ibar::before { content: ""; position: absolute; left: 22%; top: -6px; bottom: -6px; width: 1px; background: var(--faint); }
.ibar i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
.ibar i.neg { background: var(--faint); border-radius: 4px 0 0 4px; }
.eq { font-size: 24px; margin: 12px 0; font-variant-numeric: tabular-nums; color: var(--ink2); }
.eq small { font-size: 18px; color: var(--muted); margin-left: 6px; }
.eq b { font-weight: 700; color: var(--ink); }
.eq.big { font-size: 30px; margin-top: 26px; color: var(--ink); letter-spacing: -.01em; }
.wbar, .stack { display: flex; height: 30px; gap: 2px; margin: 10px 0 4px; font-size: 16px; font-weight: 650; line-height: 29px; }
.wbar div, .stack div { border-radius: 6px; padding-left: 10px; white-space: nowrap; overflow: hidden; }
.wbar .own, .stack .s1 { background: var(--accent); color: #fff; } :root[data-theme="dark"] .wbar .own, :root[data-theme="dark"] .stack .s1 { color: #0a0e16; }
.wbar .pool { background: var(--bar); color: #0b0b0b; }
.stack .s2 { background: var(--st-escalated_sudo_command); color: #fff; } :root[data-theme="dark"] .stack .s2 { color: #0a0e16; }
.stack .rest { background: var(--grid); }
.calc { display: grid; grid-template-columns: 196px 1fr 110px; align-items: center; column-gap: 14px; height: 46px; padding: 0 18px; margin-top: 6px; background: var(--surface2); border-radius: 10px; white-space: nowrap; }
.calc b { font-size: 19px; font-weight: 650; }
.calc span { font-size: 18.5px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.calc strong { font-size: 26px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.final { margin-top: 12px; padding: 12px 18px 9px; border-radius: 12px; background: var(--accent-soft); }
.feq { font-size: 27px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }

<script>
"use strict";
const D = JSON.parse(document.getElementById("demo-data").textContent);
const ST = D.meta.stage_order, SN = D.meta.stage_names, SCAN = new Set(["service_scan", "wpscan", "dirb"]);
const CODE = { service_scan: "svc", wpscan: "wp", dirb: "dir", attacker_change_user: "user", escalated_sudo_command: "sudo", dnsteal: "dns" };
const TAKE = new Set(["attacker_change_user", "escalated_sudo_command"]);       // the steps where the attacker takes control
// the two replays: the plan's scenario, and harrison, the one scenario of eight where ours ranks ahead
const SCN = [["russellmitchell", "index.html"], ["harrison", "harrison.html"]];
const SYS = { B0: "Wazuh rule level", B2: "Ours: context layer", B_RBA: "Risk-based alerting" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const int = (n) => Math.round(n).toLocaleString("en-US");
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const p2 = (n) => String(n).padStart(2, "0");
const dt = (ts) => new Date(ts * 1000);
const hhmm = (ts) => p2(dt(ts).getUTCHours()) + ":" + p2(dt(ts).getUTCMinutes());

const shortRule = (s) => s.replace(/^Suricata: Alert - /, "").replace(/\.$/, "");

  for (let d = 5; d < 9; d++) if (+fix(v, d) < lim) return fix(v, d);
  return fix(v, 9);
};

  for (const dw of [2, 3, 4, 5, 6]) for (let ds = 3; ds <= 9; ds++) {

    if ((own < 1 && o === 1) || (pool < 1 && p === 1)) continue;
    if (pct(Math.round(1e11 * (W * o + V * p)) / 1e9) === pct(s)) return [dw, ds];
  }
  return [6, 9];
};
const byGid = {};
for (const q of Object.keys(D.queues)) { byGid[q] = {}; for (const it of D.queues[q]) byGid[q][it.gid] = it; }
const rankHTML = (it) => rk(it.rank) + (it.tied > 1 ? `<small>tie of ${it.tied}</small>` : "");

/* ---------- header, timeline, legend ---------- */

const tw = (() => { const c = document.createElement("canvas").getContext("2d"), ff = getComputedStyle(document.body).fontFamily;      // width of a label in px
  return (txt, px, bold) => { c.font = `${bold ? 650 : 400} ${px}px ${ff}`; return c.measureText(txt).width; }; })();
(function timeline() {
  const sorted = [...T.all].sort((a, b) => b - a), vmax = sorted[0];
  const mag = 10 ** Math.floor(Math.log10(vmax)), cap = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map((f) => f * mag).find((v) => v >= vmax);   // true scale: no bar is cut
  const Wd = 1440, H = 136, L = cap >= 10000 ? 14 + 9.4 * int(cap).length : 48, R = 6, top = 6, base = 100, lane = 114;
  const xw = (Wd - L - R) / T.hours, x = (ts) => L + (ts - T.start_ts) / 3600 * xw, y = (v) => base - (base - top) * v / cap;
  const xa = x(T.t_attack_ts);
  let s = `<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Alerts per hour">`;
  s += `<rect x="${L}" y="2" width="${xa - L}" height="${base - 2}" rx="6" fill="var(--train)"/>`;
  for (const v of [0, cap / 2, cap]) {

    else s += `<path d="M${bx},${base} V${by + 3} q0,-3 3,-3 h${bw - 6} q3,0 3,3 V${base} Z" fill="${big ? "var(--ink2)" : "var(--bar)"}" data-tip="${tipText}"/>`;
    if (big) s += Math.abs(bx - xa) < 12 || bx - 8 > L + 420 ? `<text class="lab labb" x="${Math.abs(bx - xa) < 12 ? xa - 10 : bx - 8}" y="46" text-anchor="end">${int(v)} alerts in one hour ▸</text>`

  s += `<text class="lab" x="${L + 12}" y="22"><tspan class="labb">Training: normal activity</tspan>  ·  ${int(C.baseline_admitted)} alerts  ·  ${day(T.start_ts)} to ${day(T.t_attack_ts)} ${hhmm(T.t_attack_ts)}</text>`;
  const removed = D.meta.oracle_cleaning_removed_alerts;          // labelled attack alerts taken out of the training period, using the labels
  if (removed) s += `<text class="lab" x="${L + 12}" y="46" style="fill:var(--amber)">${int(removed)} alerts labelled as attack were removed from training, using the dataset's labels</text>`;
  s += `<text class="lab" x="${xa - 10}" y="22" text-anchor="end">first attack step ${hhmm(T.t_attack_ts)}</text>`;
  const rankTxt = `<tspan class="labb">To rank:</tspan> ${int(C.evaluation_admitted)} alerts → ${C.queue_items} items`;
  s += xa + 24 + tw(`To rank: ${int(C.evaluation_admitted)} alerts → ${C.queue_items} items`, 17) <= Wd + 20 ?`<text class="lab" x="${xa + 24}" y="22">${rankTxt}</text>` : `<text class="lab" x="${xa - 10}" y="70" text-anchor="end">${rankTxt} ▸</text>`;
  // first alert of each stage, in time order; dots that would overlap move right, never before their time
  const dot = (k, cx) => `<circle cx="${cx}" cy="${lane}" r="6.5" fill="var(--st-${k})" stroke="var(--surface)" stroke-width="2" data-tip="${esc(SN[k])} · first alert ${hms(T.stage_first_ts[k])} · ${int(T.stage_alerts[k])} alerts"/>`;
  let nx = 0, x0 = null;
  [...ST].sort((p, q) => T.stage_first_ts[p] - T.stage_first_ts[q]).forEach((k) => { const cx = Math.max(x(T.stage_first_ts[k]), nx); if (x0 === null) x0 = cx; s += dot(k, cx); nx = cx + 15; });
  const laneLeft = nx + tw("first alert of each attack stage", 15) > Wd + 20;      // no room right of the dots: the note goes to their left
  s += !laneLeft ? `<text class="ax" x="${nx}" y="${lane + 5}">first alert of each attack stage</text>`
    : `<text class="ax" x="${x0 - 12}" y="${lane + 5}" text-anchor="end">first alert of each attack stage ▸</text>`;
  for (let d0 = 0; d0 * 24 < T.hours; d0++) {

    if (!(laneLeft && tx + 56 > x0 - 250 && tx < x0)) s += `<text class="ax" x="${tx + 6}" y="${H - 5}">${day(T.start_ts + d0 * 86400)}</text>`;   // a date under that note is left out
  }

})();
$("legend").classList.toggle("many", ST.length > 5);
$("legend").innerHTML = `<div class="thead"><span class="cap">Attack stages that raise alerts</span></div><table>` +
  ST.map((k) => `<tr><td><i class="dot" style="background:var(--st-${k})"></i><span class="code">${CODE[k]}</span>${esc(SN[k])}</td><td class="t num">${hhmm(T.stage_first_ts[k])}</td><td class="n num">${int(T.stage_alerts[k])} <span>alerts</span></td></tr>`).join("") +
  `<tr><td colspan="3" style="color:var(--muted);font-size:16px"><i class="dot" style="background:var(--faint)"></i>grey rows: no attack label (benign)</td></tr></table>`;

/* ---------- queues ---------- */
function rowHTML(q, it, wide, tie, dg) {
  const main = it.stages.find((k) => !SCAN.has(k)) || it.stages[0];
  const a = `<div class="row ${main ? "attack" : "benign"}"${main ? ` style="--st:var(--st-${main})"` : ""} data-q="${q}" data-gid="${it.gid}" tabindex="0" role="button" title="${esc(it.rule)}">` +
    `<span class="rk${tie ? " tie " + tie : ""}">${rk(it.rank)}</span>`;
  const tags = it.stages.map((k) => tag(k, wide && it.stages.length === 1)).join(wide ? " " : "");
  if (wide) return a + `<span>${tags || '<span class="tag plain">benign</span>'}</span><span class="host">${esc(it.host)}</span>` +
    `<span class="ds">${esc(it.rule)}</span><span class="r">${it.level}</span><span class="r">${int(it.count)}</span><span class="r">${span(it)}</span></div>`;
  return a + `<span class="r sc">${q === "B0" ? it.level : fix(it.score, dg)}</span><span class="ds">${tags}${esc(shortRule(it.rule))}</span><span class="host">${esc(it.host)}</span><span class="r">${int(it.count)}</span><span class="r">${span(it)}</span></div>`;
}
// Scene 4 shows the score each queue is sorted by: Wazuh's rule level, our priority, the risk score of risk-based alerting.
const SCORE_NAME = { B0: "level", B2: "priority", B_RBA: "risk" };
// Decimals: the fewest (at least `d`) for which two shown items with different scores never print the same number.
function sepDigits(vals, d) {
  for (; d < 6; d++) { const seen = new Map(); if (vals.every((v) => { const t = v.toFixed(d), o = seen.get(t); seen.set(t, v); return o === undefined || o === v; })) break; }
  return d;
}
function queueHTML(q, wide) {
  const items = D.queues[q], S = D.summary[q], top = items.slice(0, 20), same = (i, j) => items[j] && items[j].score === items[i].score;
  const dg = q === "B0" ? 0 : sepDigits(top.map((it) => it.score), q === "B2" ? 1 : 3);
  const cut = top.findIndex((it) => it.rank > 20);

    const prev = i > 0 && same(i, i - 1), next = same(i, i + 1);
    if (prev || next) ties = true;

  });
  let more = "";

    const shown = new Set(top.map((it) => it.gid)), extra = [];
    for (const k of ST.filter((k) => !SCAN.has(k))) {

    }
    const ex = extra.map((g) => byGid[q][g]).sort((a, b) => a.position - b.position);
    const what = ex.every((it) => it.stages.some((k) => TAKE.has(k))) ? "the steps where the attacker takes control" : "the attack steps after the scans";
    if (ex.length) more = `<div class="cut"><b>Further down</b> &nbsp;&middot;&nbsp; ${ex.every((it) => it.rank === ex[0].rank) ? `rank ${rk(ex[0].rank)}, in a tie of ${ex[0].tied} items: ` : ""}${what}</div>` +
      ex.map((it) => rowHTML(q, it, wide, it.tied > 1 ? "mid" : "")).join("");
  }
  const head = wide ? `<span class="rk">rank</span><span>attack stage</span><span>host</span><span>rule description</span><span class="r">level</span><span class="r">alerts</span><span class="r">time, ${day(T.t_attack_ts)}</span>`
    : `<span class="rk">rank</span><span class="r">${SCORE_NAME[q]}</span><span>rule</span><span>host</span><span class="r">alerts</span><span class="r">time</span>`;
  return `<div class="card col ${q}"><div class="qhead"><div class="qname">${esc(SYS[q])}${q === "B0" ? `<small>${wide ? "what the analyst gets today" : "today"}</small>` : ""}</div>` +
    `<div class="qmetric">α-nDCG@20<b>${fix(S.andcg20, 3)}</b>${q === "B2" ? `<em>5-seed mean ${fix(S.andcg20_mean5, 3)}</em>` : ""}</div>` +
    `<div class="qchips">${wide ? `<span class="qchip">top 20 of<b>${items.length} queue items</b></span>` : ""}<span class="qchip">stages in top 20<b>${S.stages_top20} of ${S.stages}</b></span>` +
    `<span class="qchip">first non-scan item at rank<b>${rk(S.first_nonscan_rank)}</b></span>${ties ? `<span class="tie"><i></i>${wide ? "tie: shared average rank" : "tied"}</span>` : ""}</div></div>` +
    `<div class="rowhead">${head}</div>${rows}${more}</div>`;
}
function stripHTML(q) {
  const S = D.summary[q], n = D.queues[q].length, px = (v) => 6 + (v - 1) / (n - 1) * 228;

  for (const k of ST) {

    `<p class="note" style="margin:14px 0 0">Last two columns: if calibration held after training, about 1% of a host's benign windows would exceed 99.${drift >= 2 ? " Several hosts are well above that." : drift === 1 ? " One host is well above that." : ""}</p></div>`;
  // 5 priority
  const b0 = byGid.B0[gid], br = byGid.B_RBA[gid], cs = 0.8 * t.seq, cn = 0.2 * 100 * t.nu, k = it.count;
  const p5 = `<div class="card pcard"><h4>From S<sub>seq</sub> to the queue item's priority</h4>` +
    `<div class="calc"><b>Group size k</b><span>alert${k > 1 ? "s" : ""} of this rule on this host, folded into this item</span><strong>${int(k)}</strong></div>` +
    `<div class="calc"><b>Highest S<sub>seq</sub></b><span>the percentile of the item's most unusual alert</span><strong>${pct(t.s_seq_max)}</strong></div>` +
    `<div class="calc"><b>Surprise &pi;(g)</b><span>&minus;log<sub>10</sub>( 1 &minus; u<sup>k</sup> ), with u = S<sub>seq</sub> / 100, capped at 0.99999</span><strong>${fix(t.pi, 2)}</strong></div>` +
    `<div class="calc"><b>Sequence term</b><span>100 &times; min( 1, &pi; / ${D.meta.lambda} ) = 100 &times; ${fix(Math.min(t.pi, D.meta.lambda), 2)} / ${D.meta.lambda}</span><strong>${fix(t.seq, 1)}</strong></div>` +
    `<div class="calc"><b>Novelty &nu;(g)</b><span>${t.nu ? "the rule was not seen on this host during training" : "the rule was seen on this host during training"}</span><strong>${t.nu}</strong></div>` +
    `<div class="final"><div class="feq">Priority P = <span class="t1">0.8 &times; ${fix(t.seq, 1)}</span> + <span class="t2">0.2 &times; 100 &times; ${t.nu}</span> = ${fix(cs, 1)} + ${fix(cn, 1)} = <b>${fix(t.priority, 1)}</b></div>` +
    `<div class="stack"><div class="s1" style="width:${cs}%">${cs >= 12 ? "sequence " + fix(cs, 1) : ""}</div>${cn ? `<div class="s2" style="width:${cn}%">novelty ${fix(cn, 1)}</div>` : ""}<div class="rest" style="flex:1"></div></div>` +
    `<div class="note">scale 0 to 100</div></div>` +
    `<h4 style="margin-top:18px">Rank of this item in each queue, of ${D.queues.B2.length} <span>&middot; and the number each queue ranks it by</span></h4><div style="max-width:900px">${ranks3(gid)}</div>` +
    `<div class="note" style="margin-top:10px">${it.tied > 1 ? `In our queue ${it.tied} items share this priority, so they share the average rank ${rk(it.rank)}.` : ""}</div></div>` +
    `<div class="card pcard"><h4>5 &middot; Priority</h4><p class="say">The item's priority is 0.8 of the sequence term plus 0.2 of the novelty flag. Rule level and exposure have weight 0.</p>` +
    stat(fix(t.priority, 1), "priority P of the item") + stat(rk(it.rank), `its rank among ${D.queues.B2.length} queue items${it.tied > 1 ? ` <em>&middot; tie of ${it.tied}</em>` : ""}`) +
    stat(rk(b0.rank), `its rank by rule level alone${b0.tied > 1 ? ` <em>&middot; tie of ${b0.tied}</em>` : ""}`) + stat(rk(br.rank), "its rank under risk-based alerting") + `</div>`;
  const steps = [["Window", `${win.length} entries`], ["Features", "14 model features"], ["Forest", `raw score s = ${fix(wk.raw, 3)}`],
    ["Calibration", `S<sub>seq</sub> = ${pct(wk.s)}`], ["Priority", `P = ${fix(t.priority, 1)} → rank ${rk(it.rank)}`]];
  const title = isDef ? `The ${esc(SN[D.walkthrough.alert.label] || "alert")} on ${esc(it.host)}` : `${benign ? "A benign alert" : "A " + esc(SN[wk.label]) + " alert"} on ${esc(it.host)}`;
  return `<div class="whead"><h3>${title}</h3><span class="a">${day(wk.ts)} ${hms(wk.ts)} &middot; rule ${esc(wk.rule_id)} &ldquo;${esc(shortRule(rule))}&rdquo; &middot; level ${wk.level} &nbsp;${benign ? '<span class="tag plain">benign</span>' : tag(wk.label, true)}</span>` +
    (isDef ? `<span class="real">Real numbers. The slides use illustrative ones for the sudo alert.</span>` : `<button class="reset" id="walk-reset">&larr; Back to the ${esc(SN[D.walkthrough.alert.label] || "first alert")}</button>`) +
    `<select id="walk-pick" aria-label="Follow another alert">${pickOptions.map(([g, txt]) => `<option value="${g}"${g === gid ? " selected" : ""}>${esc(txt)}</option>`).join("")}</select></div>` +
    `<div class="stepper">${steps.map((c, i) => `<button class="step" data-step="${i + 1}"><span class="n">${i + 1}</span><span><span class="t">${c[0]}</span><span class="v">${c[1]}</span></span></button>`).join("")}` +
    `<div class="navb"><button id="back">&larr; Back</button><button id="next" class="next">Next &rarr;</button></div></div>` +
    [p1, p2h, p3, p4, p5].map((p, i) => `<div class="panel" data-step="${i + 1}">${p}</div>`).join("");
}
let walkGid = null;
function setWalk(gid) { if (walkGid !== gid) { walkGid = gid; $("view-w").innerHTML = walkHTML(gid); } }

/* ---------- states: one key reaches every state ---------- */
const topBenign = D.queues.B2.find((it) => it.stages.length === 0);
const STATES = [
  { view: "b0", n: "Scenes 1–2", t: "The input, and what the analyst gets today" },
  ...[1, 2, 3, 4, 5].map((n) => ({ view: "w", step: n, n: "Scene 3", t: `Follow one alert through the layer · ${n} of 5` })),
  { view: "3", n: "Scene 4", t: "Three queues side by side" },
  { view: "3", detail: ["B2", topBenign.gid], n: "Scene 5", t: "Why a benign item ranks high" },
];
$("prog").innerHTML = STATES.map(() => "<i></i>").join("");
let cur = 0, detail = null, lastQ = 0, lastW = 1;
function render() {
  const s = STATES[cur];
  for (const v of ["b0", "3", "w"]) $("view-" + v).classList.toggle("on", s.view === v);
  $("tab-q").classList.toggle("on", s.view !== "w"); $("tab-w").classList.toggle("on", s.view === "w");
  $("seg").style.visibility = s.view === "w" ? "hidden" : "visible";
  $("v-b0").classList.toggle("on", s.view === "b0"); $("v-3").classList.toggle("on", s.view === "3");
  $("scene-n").textContent = s.n; $("scene-t").textContent = s.t;
  [...$("prog").children].forEach((d, i) => d.classList.toggle("on", i === cur));
  if (s.view === "w") {
    lastW = cur;
    document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("on", +p.dataset.step === s.step));
    document.querySelectorAll(".step").forEach((c) => { c.classList.toggle("on", +c.dataset.step === s.step); c.classList.toggle("done", +c.dataset.step <= s.step); });
    $("back").disabled = cur === 0; $("next").disabled = cur === STATES.length - 1;
  } else lastQ = cur >= 6 ? 6 : 0;
  document.querySelectorAll(".row.sel").forEach((r) => r.classList.remove("sel"));
  const d = $("detail");
  if (detail && s.view !== "w") {
    const [q, gid] = detail;
    d.innerHTML = detailHTML(q, byGid[q][gid]);
    d.className = s.view === "3" && q !== "B0" ? "left" : "right";
    d.hidden = false;
    document.querySelectorAll(`#view-${s.view} .row[data-q="${q}"][data-gid="${gid}"]`).forEach((r) => r.classList.add("sel"));
  } else d.hidden = true;
  try { history.replaceState(null, "", "#" + cur + (document.documentElement.dataset.theme === "dark" ? "d" : "")); } catch (e) { /* file:// in some browsers */ }
}
// Entering the walkthrough from a queue shows the scripted alert again; follow() shows another one.
function go(i, keep) {
  const ni = Math.max(0, Math.min(STATES.length - 1, i));
  if (STATES[ni].view === "w" && STATES[cur].view !== "w" && !keep) setWalk(WG);
  cur = ni; detail = STATES[cur].detail || null; render();
}
function follow(gid, stay) { setWalk(gid); go(stay && STATES[cur].view === "w" ? cur : 1, true); }
$("tab-q").onclick = () => go(lastQ); $("tab-w").onclick = () => go(lastW);
$("v-b0").onclick = () => go(0); $("v-3").onclick = () => go(6);
document.addEventListener("click", (e) => {
  const row = e.target.closest(".row"), step = e.target.closest(".step"), fol = e.target.closest("[data-follow]"), scn = e.target.closest("[data-scn]");
  if (scn) { e.preventDefault(); location.href = scn.dataset.scn + "#" + cur + (document.documentElement.dataset.theme === "dark" ? "d" : ""); }       // the other replay, same scene and theme
  else if (fol) follow(+fol.dataset.follow);
  else if (row) { detail = [row.dataset.q, +row.dataset.gid]; render(); }
  else if (step) go(+step.dataset.step);
  else if (e.target.id === "walk-reset") follow(WG, true);
  else if (e.target.id === "detail-x") { detail = null; render(); }
  else if (e.target.id === "next") go(cur + 1);
  else if (e.target.id === "back") go(cur - 1);
});
document.addEventListener("change", (e) => { if (e.target.id === "walk-pick") { follow(+e.target.value, true); } });
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (e.target.tagName === "SELECT" && k !== "Escape") return;          // the alert picker uses the arrow keys itself
  if (k === "ArrowRight" || k === "PageDown" || k === " ") go(cur + 1);
  else if (k === "ArrowLeft" || k === "PageUp") go(cur - 1);
  else if (k === "Home" || k === "1" || k === "2") go(0);
  else if (k === "3") { setWalk(WG); go(1, true); }
  else if (k === "4") go(6);
  else if (k === "5" || k === "End") go(7);
  else if (k === "q" || k === "Q") go(lastQ);
  else if (k === "w" || k === "W") go(lastW);
  else if (k === "t" || k === "T") { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; render(); }
  else if (k === "s" || k === "S") { const o = SCN.find(([n]) => n !== D.meta.scenario); location.href = o[1] + "#" + cur + (document.documentElement.dataset.theme === "dark" ? "d" : ""); }
  else if (k === "Escape") { if (e.target.blur) e.target.blur(); detail = null; render(); }
  else if (k === "Enter" && document.activeElement && document.activeElement.classList.contains("row")) document.activeElement.click();
  else return;
  e.preventDefault();
});

/* ---------- fit the 1920 x 1080 stage to the window; tooltips ---------- */
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("stage").style.transform = `scale(${scale}) translate(-50%, -50%)`;
}
addEventListener("resize", fit); fit();
const tip = $("tip");
document.addEventListener("mousemove", (e) => {
  const t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!t) { tip.hidden = true; return; }
  const r = $("stage").getBoundingClientRect();
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const px = (e.clientX - r.left) / scale, py = (e.clientY - r.top) / scale;
  tip.style.left = Math.min(px + 14, 1920 - tip.offsetWidth - 8) + "px"; tip.style.top = Math.max(4, py - 40) + "px";
});
const h0 = /^#(\d)(d?)(?:g(\d+))?$/.exec(location.hash);              // #3 state 3; #3d dark; #3g12 state 3 for the alert of item 12
if (h0 && h0[2]) document.documentElement.dataset.theme = "dark";
setWalk(h0 && h0[3] && D.walks[h0[3]] ? +h0[3] : WG);
go(h0 ? +h0[1] : 0, true);
</script>
</body>
</html>
